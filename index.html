<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Winter Chahia">
<meta name="theme-color" content="#FFF6EF">
<title>WINTER CHAHIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --o:#E8631A;--o2:#F59E5B;--peach:#FBD3B5;--soft:#FDE8D8;
  --bg:#FFF6EF;--card:#FFFDFB;--ink:#3A2418;--mute:#9A7B6A;--line:#F3E2D5;
  --shadow:0 10px 30px -12px rgba(200,90,30,.28);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;transition:background .5s,color .5s;overscroll-behavior-y:none}
body.night{--bg:#24150E;--card:#342117;--ink:#FBEBDD;--mute:#C9A58C;--line:#4A3022;--soft:#45291B;--shadow:0 10px 30px -12px rgba(0,0,0,.6)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--o2)}
textarea{resize:none;min-height:110px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.1}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
#app{max-width:620px;margin:0 auto;padding:0 18px calc(120px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.card{background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--shadow);margin-top:16px}
.sec{margin:26px 4px 10px;display:flex;align-items:center;justify-content:space-between}
.btn{background:var(--o);color:#fff;border-radius:999px;padding:15px 22px;font-weight:600;width:100%;font-size:16px;box-shadow:0 10px 24px -10px rgba(232,99,26,.7);transition:transform .15s}
.btn:active,.tap:active{transform:scale(.96)}
.btn.ghost{background:var(--soft);color:var(--o);box-shadow:none}
.btn.sm{width:auto;padding:10px 16px;font-size:14px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 16px;border-radius:999px;background:var(--soft);color:var(--ink);font-size:14px;font-weight:500;transition:all .2s}
.pill.on{background:var(--o);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--soft);font-size:12.5px;color:var(--mute)}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.back{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--peach);flex:none;display:grid;place-items:center;transition:all .25s}
.check.on{background:var(--o);border-color:var(--o);animation:pop .35s}
.check.on::after{content:'';width:8px;height:13px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.thumb{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--peach),var(--o2));overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.circle{width:58px;height:58px;border-radius:50%;background:var(--o);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 18px -8px rgba(232,99,26,.8);transition:all .25s;position:relative}
.circle.off{background:var(--soft);box-shadow:none;filter:grayscale(.3)}
.circle .badge{position:absolute;bottom:-4px;right:-4px;background:var(--card);color:var(--o);font-size:11px;font-weight:700;border-radius:999px;padding:2px 6px;box-shadow:var(--shadow)}
.ess{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.ess span{display:block;font-size:13px;margin-top:8px;font-weight:500}
.ess .tap{display:flex;flex-direction:column;align-items:center}
/* hero */
.hero{position:relative;margin:0 -18px;padding:34px 24px 60px;min-height:280px;overflow:hidden;border-radius:0 0 42px 42px;background:linear-gradient(160deg,#F9C49A 0%,#EE8A45 55%,#C9531A 100%);color:#fff}
.hero.night{background:linear-gradient(160deg,#5A3322 0%,#3A2016 60%,#24150E 100%)}
.hero.day{background:linear-gradient(160deg,#FFE3C8 0%,#F7A868 60%,#E8631A 100%)}
.hero h1{font-size:36px;position:relative}
.hero .sub{font-family:var(--serif);font-size:19px;opacity:.95;margin-top:6px;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
.sun{position:absolute;right:-30px;top:-30px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#FFE9B8 0%,#FFC77A 45%,rgba(255,199,122,0) 70%)}
.datepill{position:absolute;right:20px;top:92px;background:rgba(255,253,251,.92);color:#3A2418;border-radius:18px;padding:8px 14px;text-align:center;font-size:12.5px;line-height:1.3;box-shadow:var(--shadow)}
.quote{position:relative;display:inline-block;margin-top:34px;background:rgba(255,253,251,.9);color:#6d4630;font-family:var(--serif);font-style:italic;font-size:14px;padding:12px 18px;border-radius:22px 22px 22px 6px;max-width:78%}
.hero + .card{margin-top:-34px;position:relative}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -8px 30px -12px rgba(160,70,20,.25)}
nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:70px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);font-weight:500}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--o)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(38px + env(safe-area-inset-bottom,0px));z-index:21;width:64px;height:64px;border-radius:50%;background:var(--o);color:#fff;font-size:34px;font-weight:300;box-shadow:0 12px 26px -8px rgba(232,99,26,.9),0 0 0 6px var(--bg);transition:transform .25s}
.fab.open{transform:translateX(-50%) rotate(45deg)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(40,20,10,.35);z-index:30;opacity:0;transition:opacity .25s;backdrop-filter:blur(3px)}
.veil.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:620px;margin:0 auto;background:var(--card);border-radius:32px 32px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1)}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.qa button{background:var(--soft);border-radius:24px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.qa button b{font-size:26px;width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.list-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border-radius:18px;text-align:left;font-weight:500}
.list-btn:active{background:var(--soft)}
.list-btn b{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;z-index:50;font-weight:500;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:90%;text-align:center;font-size:14px}
.toast.show{transform:translate(-50%,0)}
.banner{background:linear-gradient(135deg,var(--soft),var(--card));border:1.5px dashed var(--o2);border-radius:22px;padding:14px 16px;margin-top:16px;display:flex;align-items:center;gap:12px}
.banner p{flex:1;font-weight:500}
/* dépose */
.bigtitle{font-family:var(--serif);font-size:34px;text-align:center;color:var(--o);margin-top:6px}
.intro{text-align:center;color:var(--mute);max-width:360px;margin:10px auto 0}
.composer{position:relative;margin-top:20px}
.composer textarea{min-height:170px;border-radius:26px;background:var(--card);border:0;box-shadow:var(--shadow);padding:18px 18px 60px;font-size:16px}
.composer .send{position:absolute;right:12px;bottom:12px;width:46px;height:46px;border-radius:50%;background:var(--o);color:#fff;font-size:20px}
.composer .mic{position:absolute;left:12px;bottom:12px;width:46px;height:46px;border-radius:50%;background:var(--soft);font-size:20px}
.mic.rec{background:var(--o)!important;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,99,26,.5)}100%{box-shadow:0 0 0 18px rgba(232,99,26,0)}}
.tools{display:flex;justify-content:center;gap:22px;margin-top:18px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.tools button b{width:50px;height:50px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:20px}
.understood{position:relative;overflow:hidden}
.understood::before{content:'';position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:var(--peach);opacity:.5}
.dot{width:9px;height:9px;border-radius:50%;background:var(--o);display:inline-block}
.parsed{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);position:relative}
.parsed input{padding:9px 12px;border-radius:12px}
.parsed select{padding:7px 8px;border-radius:12px;font-size:12.5px;width:auto}
.parsed .x{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--mute)}
/* week */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.days button{border-radius:18px;padding:9px 0;background:var(--card);box-shadow:var(--shadow);font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.days button b{font-size:16px;color:var(--ink)}
.days button.on{background:var(--o);color:#fff}
.days button.on b{color:#fff}
.days button i{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--o2)}
.moment-h{font-family:var(--serif);font-size:18px;margin:18px 4px 6px}
.protect{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cmd{display:flex;gap:8px;margin-top:14px}
.cmd input{border-radius:999px;background:var(--card);border:0;box-shadow:var(--shadow)}
.cmd button{width:48px;height:48px;border-radius:50%;background:var(--o);color:#fff;flex:none;font-size:18px}
/* vide */
.vide{margin:0 -18px;min-height:calc(100vh - 120px);padding:24px 18px;background:linear-gradient(180deg,var(--bg),var(--peach));border-radius:0 0 40px 40px;text-align:center}
.heart{font-size:46px;animation:beat 2.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}}
.recbig{width:170px;height:170px;border-radius:50%;margin:26px auto 8px;background:radial-gradient(circle,var(--card) 55%,rgba(255,253,251,.5) 56%,rgba(255,253,251,.2) 70%,transparent 71%);display:grid;place-items:center;position:relative}
.wave{display:flex;gap:3px;align-items:center;height:40px}
.wave i{width:4px;border-radius:4px;background:var(--o);height:8px;transition:height .15s}
.recbig.rec .wave i{animation:wv .9s infinite ease-in-out}
@keyframes wv{0%,100%{height:8px}50%{height:36px}}
.choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.fly{animation:fly 1.4s forwards}
@keyframes fly{to{transform:translateY(-220px) scale(.6) rotate(-6deg);opacity:0;filter:blur(6px)}}
/* grids */
.hcard{border-radius:28px;padding:20px;color:#fff;background:linear-gradient(140deg,#B94F18,#E8631A 60%,#F59E5B);position:relative;overflow:hidden;box-shadow:var(--shadow);margin-top:16px}
.hcard .ring{position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.14)}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:600}
.tile b{font-size:26px}
.gallery{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px}
.gallery::-webkit-scrollbar{display:none}
.ph{flex:none;width:120px;height:140px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(140deg,var(--peach),var(--o2));display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{position:relative;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ph .em{position:absolute;top:12px;left:12px;font-size:26px}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mute)}
.bars i{width:100%;border-radius:10px 10px 5px 5px;background:linear-gradient(180deg,var(--o2),var(--o));min-height:6px;transition:height .6s}
.money-big{font-family:var(--serif);font-size:42px;font-weight:600}
.lesson-step{min-height:180px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:var(--soft);margin-top:10px;font-weight:500}
.opt.good{background:#DDF3E0;color:#1F6B33}
.opt.bad{background:#FBDADA;color:#9A2B2B}
.steps{display:flex;gap:6px;margin:10px 0 16px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--o)}
.calm{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#5A3322,#1c100a);color:#FBEBDD;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.breath{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#F59E5B,#E8631A);animation:breath 10s infinite ease-in-out;margin-bottom:40px;box-shadow:0 0 80px rgba(245,158,91,.5)}
@keyframes breath{0%,100%{transform:scale(.7)}40%{transform:scale(1.1)}}
.empty{text-align:center;padding:26px 10px;color:var(--mute)}
.empty b{display:block;font-size:34px;margin-bottom:8px}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px 4px;font-weight:500}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.bub{background:var(--card);border-radius:22px 22px 22px 6px;padding:13px 16px;box-shadow:var(--shadow);max-width:86%}
.bub.me{margin:12px 0 0 auto;background:var(--o);color:#fff;border-radius:22px 22px 6px 22px;width:fit-content}
.ava{width:34px;height:34px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--o2),var(--o));color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700}
.goal{background:var(--soft);border-radius:18px;padding:10px 12px;margin-top:8px;display:flex;align-items:center;gap:10px}
.goal input{background:transparent;border:0;padding:4px 0;font-weight:600}
.mile{display:grid;grid-template-columns:80px 1fr;gap:8px;font-size:13.5px;padding:4px 0}
@media (min-width:760px){#app{max-width:760px}.tiles{grid-template-columns:repeat(3,1fr)}.qa{grid-template-columns:repeat(6,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" data-a="quick" aria-label="Ajouter">+</button>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
/* ============ OUTILS ============ */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(new Date(s+'T12:00').getDay()+6)%7;
const monday=s=>addD(s,-dow(s));
const JOURS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const dnum=s=>new Date(s+'T12:00').getDate();
const fmt=s=>s?JOURS[dow(s)]+' '+dnum(s)+' '+MOIS[new Date(s+'T12:00').getMonth()]:'';
const short=s=>dnum(s)+' '+MOIS[new Date(s+'T12:00').getMonth()].slice(0,4);
const rel=s=>s===today()?"aujourd'hui":s===addD(today(),1)?'demain':fmt(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const cap1=s=>s? s.charAt(0).toUpperCase()+s.slice(1):s;
const eur=n=>(Math.round(n*100)/100).toLocaleString('fr-FR')+' €';

/* ============ DONNÉES ============ */
const KEY='winterchahia.v1';
function seed(){
  const y=new Date().getFullYear();
  return {name:'Aïcha',cap:200,apiKey:'',heroPhoto:'',tasks:[],light:{},
    habits:[
      {id:'tahajjud',t:'Tahajjud',ic:'🌙'},{id:'dhikr',t:'Dhikr',ic:'📿'},
      {id:'fajr',t:'Fajr',g:'p'},{id:'dhuhr',t:'Dhuhr',g:'p'},{id:'asr',t:'Asr',g:'p'},{id:'maghrib',t:'Maghrib',g:'p'},{id:'isha',t:'Isha',g:'p'},
      {id:'sport',t:'Sport',ic:'💪'}],
    hlog:{},
    projects:[{id:uid(),name:'SHAÏAH',desc:'Kimonos et accessoires plissés',goal:'',status:'CONSTRUCTION',budget:'',deadline:'',notes:'',actions:[],main:true,created:today()}],
    later:[],objectives:[],exps:[],money:[],goals:[],memories:[],dumps:[],journal:[],lessonsDone:{},notes:[],customLessons:[],
    seasonStart:y+'-10-01',seasonEnd:y+'-12-31',lastPlan:null};
}
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!S)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Mémoire pleine : exporte une sauvegarde et retire quelques photos.")}}

const TYPES={
  tache:{l:'Action',ic:'✦',dur:30,m:'aprem'},projet:{l:'Projet',ic:'🛠',dur:60,m:'aprem'},

/* ============ RYTHME & PLANIFICATION SUR MESURE ============ */
const hm=v=>{if(!v)return 0;const [h,m]=String(v).split(':').map(Number);return h*60+(m||0)};
const mh=n=>String(Math.floor(n/60)%24).padStart(2,'0')+'h'+String(Math.round(n%60)).padStart(2,'0');
const tm=(h,m)=>String(+h).padStart(2,'0')+':'+(m?String(m).padStart(2,'0'):'00');
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
function defRhythm(){return {set:false,wake:'07:00',sleep:'23:00',lunch:'12:30',dinner:'20:00',commute:30,
  week:[0,1,2,3,4,5,6].map(i=>i<5?{type:'travail',start:'09:00',end:'17:30'}:{type:'libre',start:'',end:''}),
  focus:'soir',sportMoment:'matin',sportDays:[],projectDays:[5],rest:6,maxPerDay:3,fill:.5,text:''}}
if(!S.rhythm)S.rhythm=defRhythm();
const R=()=>S.rhythm||(S.rhythm=defRhythm());
const MWIN={matin:[0,720],aprem:[720,1080],soir:[1080,1440]};
const momentOf=at=>at<720?'matin':at<1080?'aprem':'soir';
const isSport=t=>t.type==='habitude'&&/sport|courir|course|salle|yoga|pilates|marche|natation|muscu|fitness/i.test(t.t);
const WORK=['tache','projet','apprentissage'];
function blocks(day){
  const r=R(),d=r.week[dow(day)];
  const b=[[0,hm(r.wake)+30],[hm(r.sleep)-60,1440],[hm(r.lunch),hm(r.lunch)+60],[hm(r.dinner),hm(r.dinner)+60]];
  if(d.type!=='libre'&&d.start&&d.end)b.push([hm(d.start)-(+r.commute||0),hm(d.end)+(+r.commute||0)]);
  return b;
}
function merge(b){const out=[];let cur=0;[...b].sort((x,y)=>x[0]-y[0]).forEach(([s,e])=>{if(s>cur)out.push([cur,s]);cur=Math.max(cur,e)});if(cur<1440)out.push([cur,1440]);return out}
function freeSlots(day,ignore){
  const b=[...blocks(day),...S.tasks.filter(t=>t.date===day&&t.at!=null&&t!==ignore&&!t.done).map(t=>[t.at-10,t.at+(t.dur||30)+10])];
  if(day===today())b.push([0,nowMin()+20]);
  return merge(b).filter(([s,e])=>e-s>=10);
}
const baseFree=day=>merge(blocks(day)).reduce((a,[s,e])=>a+e-s,0);
const undone=d=>S.tasks.filter(t=>t.date===d&&!t.done);
const dayLoad=d=>undone(d).filter(t=>t.type!=='habitude').reduce((a,t)=>a+(t.dur||30),0);
const dayCount=d=>undone(d).filter(t=>t.type!=='habitude').length;
const capOf=d=>Math.min(baseFree(d)*(+R().fill||.5),S.dailyMin?S.dailyMin*1.25:1e9)*(S.light[d]?.5:1);
const maxOf=d=>{let m=+R().maxPerDay||3;if(S.light[d])m=Math.max(1,m-1);return m};
function prefMoments(t,day){
  const r=R();let p=t.pm||null;
  if(!p){if(isSport(t))p=r.sportMoment;else if(['projet','apprentissage'].includes(t.type))p=r.focus;else if(t.type==='experience')p=r.week[dow(day)].type==='libre'?'aprem':'soir';else p=r.week[dow(day)].type==='libre'?'aprem':'soir'}
  const all=['matin','aprem','soir'];return p?[p,...all.filter(x=>x!==p)]:all;
}
function findTime(t,day){
  const dur=t.dur||30;
  for(const m of prefMoments(t,day)){const [ws,we]=MWIN[m];
    for(const [s,e] of freeSlots(day,t)){const z=Math.min(e,we);const at=Math.ceil(Math.max(s,ws)/15)*15;if(at+dur<=z)return at}}
  return null;
}
function dayOk(t,day){
  const r=R();
  if(r.rest!==''&&r.rest!=null&&+r.rest===dow(day)&&WORK.includes(t.type))return false;
  if(t.type!=='habitude'&&dayCount(day)>=maxOf(day))return false;
  if(!['experience','habitude'].includes(t.type)&&dayLoad(day)+(t.dur||30)>capOf(day))return false;

}
function why(t,day,at){
  const r=R(),d=r.week[dow(day)],parts=[];
  if(d.type==='travail'&&at>=hm(d.end))parts.push(`après ton travail (fin à ${mh(hm(d.end))})`);
  else if(d.type==='travail'&&at<hm(d.start))parts.push('avant ton travail');
  else if(d.type==='ecole'&&at>=hm(d.end))parts.push('après tes cours');
  else if(d.type==='libre')parts.push('ta journée libre');
  if(t.type==='projet'&&r.projectDays.includes(dow(day)))parts.push('ton jour projets');
  if(isSport(t)&&momentOf(at)===r.sportMoment)parts.push('ton moment sport');
  if(['projet','apprentissage'].includes(t.type)&&momentOf(at)===r.focus)parts.push('ton moment de concentration');
  return `${cap1(rel(day))} à ${mh(at)}`+(parts.length?' : '+parts.join(', ')+'.':'.');
}
function place(t,from){
  if(t.date){const at=findTime(t,t.date);t.at=at;
    if(at!=null){t.moment=momentOf(at);t.why=why(t,t.date,at)}else{t.moment=prefMoments(t,t.date)[0];t.why='Pas de créneau libre ce jour-là : à caser quand tu peux.'}return t}
  const d=from&&from>today()?from:today();const r=R();
  const days=[...Array(28)].map((_,i)=>addD(d,i));let order=days;
  if(t.type==='projet'&&r.projectDays.length){const pd=days.slice(0,7).filter(x=>r.projectDays.includes(dow(x)));order=[...pd,...days.filter(x=>!pd.includes(x))]}
  if(t.type==='experience'){const fr=days.slice(0,10).filter(x=>r.week[dow(x)].type==='libre');order=[...fr,...days.filter(x=>!fr.includes(x))]}
  for(const day of order){if(!dayOk(t,day))continue;const at=findTime(t,day);if(at==null)continue;
    t.date=day;t.at=at;t.moment=momentOf(at);t.why=why(t,day,at);return t}
  t.date=d;t.at=null;t.moment=prefMoments(t,d)[0];t.why="Ta semaine est pleine : je l'ai mis ici, à caser quand tu peux.";return t;
}
function newTask(o){return {id:uid(),t:o.t,type:o.type||'tache',date:o.date||null,fixed:!!o.date,pm:o.moment||null,moment:o.moment||null,at:null,why:'',dur:o.dur||(TYPES[o.type]||TYPES.tache).dur||30,prio:o.prio||2,done:false,note:'',photo:'',proj:o.proj||'',expId:o.expId||'',postponed:0,created:today(),goal:o.goal||''}}
function spread(o,n){
  const d=o.date||today();const end=addD(monday(d),6);let days=[];for(let x=d;x<=end;x=addD(x,1))days.push(x);
  let i=1;while(days.length<n)days.push(addD(end,i++));
  const even=(arr,k)=>[...Array(k)].map((_,j)=>arr[Math.floor(j*arr.length/k)]);
  const pref=isSport({t:o.t,type:o.type})&&R().sportDays.length?days.filter(x=>R().sportDays.includes(dow(x))):[];
  const chosen=pref.length>=n?even(pref,n):[...pref,...even(days.filter(x=>!pref.includes(x)),n-pref.length)];
  return chosen.map(day=>{const t=place(newTask({...o,date:day}));t.fixed=false;if(t.at==null){for(let k=1;k<7;k++){const d2=addD(day,k);if(S.tasks.some(x=>x.date===d2&&x.t===t.t))continue;t.date=d2;place(t);if(t.at!=null)break}if(t.at==null){t.date=null;place(t,addD(day,1))}}S.tasks.push(t);return t});
}
function nextDow(i){const t=today();let d=addD(monday(t),i);if(d<t)d=addD(d,7);return d}
function lighten(day,n){
  const c=undone(day).filter(t=>!['experience','evenement'].includes(t.type)).sort((a,b)=>a.prio-b.prio||b.dur-a.dur).slice(0,n);
  c.forEach(t=>{t.date=null;t.postponed++;place(t,addD(day,1))});
  save();return c;
}
const overloaded=d=>dayLoad(d)>capOf(d)||dayCount(d)>maxOf(d);
function replanAll(){
  const fut=S.tasks.filter(t=>!t.done&&t.date&&t.date>=today());
  fut.forEach(t=>t.at=null);
  const keep=fut.filter(t=>['experience','evenement'].includes(t.type)||t.fixed),flex=fut.filter(t=>!keep.includes(t));
  flex.forEach(t=>{t._d=t.date;t.date=null});
  keep.forEach(t=>place(t));
  flex.sort((a,b)=>b.prio-a.prio).forEach(t=>{if(isSport(t)&&t._d>=today()&&!(R().sportDays.length&&!R().sportDays.includes(dow(t._d)))){t.date=t._d;place(t);if(t.at==null){t.date=null;place(t)}}else place(t);delete t._d});

const byTime=(a,b)=>((a.at??(['matin','aprem','soir'].indexOf(a.moment||'aprem')*360+300))-(b.at??(['matin','aprem','soir'].indexOf(b.moment||'aprem')*360+300)))||b.prio-a.prio;

/* ---------- comprendre le rythme ---------- */
function daysIn(n){
  const s=new Set();
  const rg=n.match(/du (lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche) au (lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)/);
  if(rg){const a=JOURS.indexOf(rg[1]),b=JOURS.indexOf(rg[2]);for(let i=a;i!==b;i=(i+1)%7)s.add(i);s.add(b)}
  if(/en semaine|jours de semaine/.test(n))[0,1,2,3,4].forEach(i=>s.add(i));
  if(/week.?end/.test(n)){s.add(5);s.add(6)}
  JOURS.forEach((j,i)=>{if(new RegExp('\\b'+j+'s?\\b').test(n))s.add(i)});
  return [...s].sort();
}
function parseRhythm(text){
  const r=JSON.parse(JSON.stringify(R()));
  norm(text).split(/[.;!\n]|,(?= *(?:je |j'|le |les |mes |et je |mais ))/).forEach(sn=>{
    const n=sn.trim();if(!n)return;const ds=daysIn(n);let m;
    const hr=n.match(/(\d{1,2})\s*h\s*(\d{2})?\s*(?:a|-|jusqu.?a)\s*(\d{1,2})\s*h?\s*(\d{2})?/);
    const type=/ratp|travail|boulot|bureau|taf|entreprise|alternance|job|poste|service/.test(n)?'travail':/ecole|cours|inseec|fac|classe|master/.test(n)?'ecole':/\blibres?\b|repos|\boff\b|rien de prevu|pas de travail/.test(n)?'libre':null;
    if(type&&!/sport|shaiah|projet/.test(n)){const tgt=ds.length?ds:(type==='libre'?[]:[0,1,2,3,4]);
      tgt.forEach(i=>{r.week[i]=type==='libre'?{type,start:'',end:''}:{type,start:hr?tm(hr[1],hr[2]):(r.week[i].start||'09:00'),end:hr?tm(hr[3],hr[4]):(r.week[i].end||'17:30')}})}
    if(m=n.match(/(leve|reveil)\D{0,20}(\d{1,2})\s*h\s*(\d{2})?/))r.wake=tm(m[2],m[3]);
    if(m=n.match(/(couche|dors|dodo|au lit)\D{0,20}(\d{1,2})\s*h\s*(\d{2})?/))r.sleep=tm(m[2],m[3]);
    if(m=n.match(/(trajet|transport)\D{0,20}(\d{1,3})\s*(min|h)/))r.commute=m[3]==='h'?+m[2]*60:+m[2];
    else if(m=n.match(/(\d{1,3})\s*min(utes)? de (trajet|transport)/))r.commute=+m[1];
    const mom=/matin/.test(n)?'matin':/soir/.test(n)?'soir':/apres.?midi|midi/.test(n)?'aprem':null;
    if(/sport|salle|courir|yoga|pilates/.test(n)){if(mom)r.sportMoment=mom;if(ds.length)r.sportDays=ds}
    if(/shaiah|projet|business|marque/.test(n)&&ds.length)r.projectDays=ds;
    if(/energie|concentr|productive|efficace|focus|en forme/.test(n)&&mom)r.focus=mom;
    if(m=n.match(/(\d)\s*(choses|taches|trucs|priorites|actions)/))r.maxPerDay=Math.min(5,Math.max(2,+m[1]));
    if(/(dimanche|samedi)s? (libres?|off|repos|tranquilles?)|pas (travailler|bosser) le (dimanche|samedi)/.test(n))r.rest=/dimanche/.test(n)?6:5;
    if(/legere|pas trop charg|doucement|tranquille/.test(n)&&!/dimanche|samedi/.test(n))r.fill=.35;
  });
  r.text=text;r.set=true;return r;
}

function matchTask(txt,pool){
  const w=norm(txt).split(/[^a-z0-9]+/).filter(x=>x.length>3);
  let best=null,score=0;
  (pool||S.tasks).forEach(t=>{const tn=norm(t.t);const s=w.filter(x=>tn.includes(x)||tn.includes(x.slice(0,5))).length;if(s>score){score=s;best=t}});
  return best;
}

/* ============ COMPRÉHENSION DU TEXTE ============ */
function detectDate(s){
  const n=norm(s);
  if(/aujourd.?hui|ce soir|ce matin|cet apres/.test(n))return today();
  if(/apres.?demain/.test(n))return addD(today(),2);

  const lessonCard=`<div class="card tap row" data-a="lesson" data-id="${les.id}"><div class="thumb">${th.ic}</div><div class="body" style="flex:1"><div class="small muted">Leçon du jour • ${th.t}</div><div style="font-weight:600">${esc(les.t)}</div></div><span class="muted">›</span></div>`;
  const wk=monday(td);const wkT=S.tasks.filter(t=>t.date>=wk&&t.date<=addD(wk,6));
  const needLife=wkT.filter(t=>t.type==='experience').length===0&&wkT.filter(t=>['projet','tache'].includes(t.type)).length>=6;
  const life=needLife?`<div class="banner"><span style="font-size:24px">✨</span><p>Tu construis beaucoup en ce moment. Et si on vivait un peu cette semaine ?</p><button class="btn sm" data-a="suggestExp">Oui</button></div>`:'';
  const sunday=dow(td)===6&&S.lastPlan!==td?`<div class="banner"><span style="font-size:24px">☕</span><p>C'est dimanche. On prépare ta semaine ensemble ?</p><button class="btn sm" data-a="go" data-r="sunday">On y va</button></div>`:'';
  const listHtml=list.length?list.map(t=>taskRow(t)).join(''):`<div class="empty"><b>🌿</b>Ta journée est libre.<br>Dépose ce que tu as en tête, je m'occupe du reste.<div style="margin-top:14px"><button class="btn sm" data-a="go" data-r="depose">Dépose tout</button></div></div>`;
  const msg=MSG[dayIdx()%MSG.length];
  if(m==='matin') return hero('',`Bonjour ${esc(S.name)} ☀️`,msg,`<div class="quote">“${QUOTES[dayIdx()%QUOTES.length]}”</div>`)+
    `<div class="card"><h3>Mes essentiels du matin</h3><div style="margin-top:14px">${essentials()}</div></div>${rhy}${sunday}${over}
     <div class="card"><div class="row between"><h3>J'ai préparé ta journée</h3><button class="small" style="color:var(--o);font-weight:600" data-a="go" data-r="week">Semaine ›</button></div><div style="margin-top:6px">${listHtml}</div></div>${lessonCard}${life}`;
  if(m==='journee'){
    const rest=list.filter(t=>!t.done),done=list.filter(t=>t.done);
    return hero('day',`Belle journée, ${esc(S.name)}`,rest.length?`Encore ${rest.length} chose${rest.length>1?'s':''}, et c'est bon.`:"Tout est fait. Profite.")+
    `<div class="card"><div class="row between"><h3>Maintenant</h3><button class="small" style="color:var(--o);font-weight:600" data-a="go" data-r="week">Semaine ›</button></div><div style="margin-top:6px">${rest.length?rest.map(t=>taskRow(t)).join(''):'<div class="empty"><b>🧡</b>Rien d\'urgent. Du temps pour toi.</div>'}</div>
     ${done.length?`<details style="margin-top:8px"><summary class="small muted">${done.length} déjà fait${done.length>1?'s':''}</summary>${done.map(t=>taskRow(t)).join('')}</details>`:''}</div>
     ${rhy}${over}<div class="card"><h3>Tes essentiels</h3><div style="margin-top:14px">${essentials()}</div></div>${lessonCard}
     <div class="card row"><span style="font-size:26px">☕</span><div><b>Temps libre protégé</b><div class="small muted">Repas, pause, et un moment sans téléphone ce soir. Je n'y touche pas.</div></div></div>${life}${sunday}`;
  }
  // soir
  const done=list.filter(t=>t.done),rest=list.filter(t=>!t.done);
  const exps=done.filter(t=>t.type==='experience').length+S.memories.filter(x=>x.date===td).length;
  const learned=done.filter(t=>t.type==='apprentissage').length+(S.notes.filter(n=>n.date===td).length);
  const photos=[...list.filter(t=>t.photo).map(t=>({p:t.photo,t:t.t})),...S.memories.filter(x=>x.date===td&&x.photo).map(x=>({p:x.photo,t:x.t})),...S.exps.filter(x=>x.date===td&&x.photo).map(x=>({p:x.photo,t:x.t}))];
  const tmr=addD(td,1);const tl=undone(tmr).slice(0,3);
  return hero('night',`Bonsoir ${esc(S.name)} 🌙`,"C'est bon pour aujourd'hui. Voilà ce que tu as fait.")+
  `<div class="card"><div class="split" style="grid-template-columns:repeat(3,1fr);text-align:center">
     ${[[done.length,'tâches'],[exps,'expérience'+(exps>1?'s':'')],[learned,'apprentissage'+(learned>1?'s':'')]].map(([n,l])=>`<div style="background:var(--soft);border-radius:20px;padding:14px 4px"><div style="font-family:var(--serif);font-size:30px;color:var(--o2)">${n}</div><div class="small muted">${l}</div></div>`).join('')}</div></div>
   <div class="sec"><h3>Tes moments du jour</h3><button class="small" style="color:var(--o2)" data-a="addMemory">+ Photo</button></div>
   <div class="gallery">${photos.length?photos.map(x=>`<div class="ph"><img src="${x.p}" alt=""><span>${esc(x.t)}</span></div>`).join(''):`<button class="ph tap" data-a="addMemory"><span class="em">📷</span><span>Garder un moment</span></button>`}</div>
   ${rest.length?`<div class="card"><div class="row between"><h3>Ce que je reporte</h3><button class="small" style="color:var(--o2);font-weight:600" data-a="postponeAll">Tout à demain ›</button></div>${rest.map(t=>`<div class="item"><div class="body"><div class="t">${esc(t.t)}</div></div><button class="chip tap" data-a="postpone" data-id="${t.id}">→ Demain</button></div>`).join('')}</div>`:''}
   <div class="card"><h3>Raconte ta journée</h3><p class="small muted" style="margin:4px 0 10px">Ce que tu as fait, vécu, appris. Je m'adapte pour demain.</p>
     <div class="composer" style="margin-top:0"><textarea id="fb" placeholder="J'ai fait du sport, avancé SHAÏAH mais pas mon apprentissage. Demain je veux une journée plus légère."></textarea>
     <button class="mic" data-a="mic" data-target="fb">🎙</button><button class="send" data-a="feedback">➤</button></div></div>
   ${tl.length?`<div class="card"><h3>Demain</h3>${tl.map(t=>taskRow(t,false)).join('')}</div>`:''}
   <div style="margin-top:20px"><button class="btn" data-a="calm">Pose ton téléphone 🧡</button></div>`;
}

/* ---------- VIVRE ---------- */

  <div style="margin-top:18px"><button class="btn" data-a="addTx">+ Ajouter une dépense</button></div>`;

function moneyInsight(m,sum){
  const r=sum('revenu',m),f=sum('fixe',m),v=sum('variable',m),b=sum('business',m),e=sum('epargne',m);
  if(!r&&!f&&!v&&!b)return '💡 Ajoute tes revenus et quelques dépenses : je t\'aiderai à voir où va ton argent.';
  const tot=f+v+b;const big=[['fixes',f],['variables',v],['business',b]].sort((a,b)=>b[1]-a[1])[0];
  let s=`💡 Ce mois-ci, tes dépenses ${big[0]} sont les plus importantes (${eur(big[1])}).`;
  if(r){const pe=Math.round(e/r*100);s+=` Tu as mis de côté ${pe} % de tes revenus${pe>=20?', bravo.':pe>0?'. Chaque euro compte.':'.'}`}
  if(r&&tot>r)s+=' Tes dépenses dépassent tes revenus : on peut regarder ensemble ce qui peut attendre.';
  return s;
}

let onb=null;
function vOnboard(){
  document.body.classList.remove('night');
  const o=onb||(onb={step:0,text:'',goals:[],minutes:null,pace:null});
  const ai=h=>`<div class="row fade" style="align-items:flex-end;gap:8px;margin-top:12px"><div class="ava">W</div><div class="bub">${h}</div></div>`;
  const me=h=>`<div class="bub me fade">${h}</div>`;
  let h=`<div class="top"><span style="width:40px"></span><span class="small muted">Ta saison • 3 mois</span>${S.season?'<button class="back tap" data-a="go" data-r="home" aria-label="Fermer">×</button>':'<span style="width:40px"></span>'}</div>`;
  h+=ai(`Salut ${esc(S.name)} 🧡`)+ai(`Tu veux travailler sur quoi durant ces trois mois ?<div class="small muted" style="margin-top:6px">Projets, corps, argent, esprit, sorties… Dis-le avec tes mots, je m'occupe de tout découper.</div>`);
  if(o.step===0){
    const sug=['Avancer SHAÏAH','Faire du sport','Épargner','Prendre confiance en moi','Me rapprocher de ma religion','Lire plus','Sortir et découvrir','Mieux dormir'];
    return h+`<div class="pills" style="flex-wrap:wrap;margin-top:16px">${sug.map(x=>`<button class="pill tap" data-a="onbSug" data-v="${esc(x)}">+ ${x}</button>`).join('')}</div>
    <div class="composer"><textarea id="onbT" placeholder="Je veux vraiment lancer SHAÏAH, faire du sport, épargner, lire plus et prendre confiance en moi…">${esc(o.text)}</textarea><button class="mic" data-a="mic" data-target="onbT">🎙</button><button class="send" data-a="onbGoals" aria-label="Envoyer">➤</button></div>`;
  }
  h+=me(esc(o.text));
  h+=ai(`J'ai compris. Pour ces trois mois, tu veux :`+(o.step===1?`${o.goals.map((g,i)=>`<div class="goal"><span>🎯</span><input value="${esc(g.t)}" data-goal="${i}"><button class="muted" data-a="onbDel" data-i="${i}" aria-label="Retirer">×</button></div>`).join('')}<div class="row" style="margin-top:8px"><input id="onbAdd" placeholder="Ajouter un objectif…" style="padding:9px 12px"><button class="btn sm" data-a="onbAddGoal">+</button></div>`
     :`<div style="margin-top:6px">${o.goals.map(g=>`<div>🎯 ${esc(g.t)}</div>`).join('')}</div>`));
  if(o.step===1)return h+`<div style="margin-top:16px"><button class="btn" data-a="onbStep" data-s="2">C'est ça</button></div>`;
  h+=ai(`Tu peux y consacrer combien de temps par jour, en moyenne ?`);
  if(o.step===2)return h+`<div class="pills" style="flex-wrap:wrap;margin-top:14px;justify-content:flex-end">${[[30,'30 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h ou plus']].map(([v,l])=>`<button class="pill tap" data-a="onbMin" data-v="${v}">${l}</button>`).join('')}</div>`;
  h+=me(o.minutes>=120?'2 h ou plus':o.minutes>=60?(o.minutes===90?'1 h 30':'1 h'):'30 min');
  h+=ai(`Et tu veux une saison plutôt…`);
  if(o.step===3)return h+`<div class="pills" style="flex-wrap:wrap;margin-top:14px;justify-content:flex-end">${Object.entries(PACE).map(([k,v])=>`<button class="pill tap" data-a="onbPace" data-v="${k}">${v.l}</button>`).join('')}</div>`;
  h+=me(PACE[o.pace].l);
  if(o.step===4)return h+ai('Je prépare ta saison… ✨');
  const M=seasonMonths();
  h+=ai(`Voilà ta saison. Je l'ai découpée mois par mois, puis en petites actions chaque jour. Tu n'as plus qu'à cocher.`);
  h+=S.season.goals.map(g=>`<div class="card fade"><h3>${esc(g.t)}</h3>${g.months.map((m,i)=>`<div class="mile"><b style="text-transform:capitalize;color:var(--o)">${M[i]}</b><span>${esc(m)}</span></div>`).join('')}</div>`).join('');
  const wk=S.tasks.filter(t=>t.goal&&t.date>=today()&&t.date<=addD(monday(today()),6)).sort((a,b)=>a.date.localeCompare(b.date)||byTime(a,b));
  h+=`<div class="sec"><h3>Cette semaine</h3><span class="small muted">${wk.length} actions</span></div><div class="card" style="margin-top:0;padding:6px 16px">${wk.slice(0,8).map(t=>`<div class="item"><div class="body"><div class="t">${esc(t.t)}</div><div class="small muted">${cap1(rel(t.date))}${t.at!=null?' à '+mh(t.at):''}</div></div></div>`).join('')}</div>`;
  return h+`<div style="margin-top:18px"><button class="btn" data-a="onbGo">C'est parti !</button></div>`;
}

function closeSheet(now){

function pickPhoto(cb){
  const f=$('#file');f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=720,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(file)};f.click();
}

async function command(v){
  const n=norm(v);const d=detectDate(v);let t;
  if(/j.?ai (finalement )?(fait|fini|termine)/.test(n)){t=matchTask(v.replace(/j.?ai (finalement )?(fait|fini|terminé|termine)/i,''),S.tasks.filter(x=>!x.done));if(t){t.done=true;t.date=t.date>today()?today():t.date;save();toast(`Bravo, « ${t.t} » est fait.`);return}}
  if(/plus envie|annule|supprime|laisse tomber|oublie/.test(n)){t=matchTask(v.replace(/je n.?ai plus envie de|annule|supprime|laisse tomber|oublie/ig,''),S.tasks.filter(x=>!x.done));if(t){S.tasks=S.tasks.filter(x=>x!==t);save();toast(`D'accord, j'ai retiré « ${t.t} ».`);return}}
  if(/prefere|deplace|decale|mets|bouge/.test(n)&&d){t=matchTask(v.replace(/je préfère faire|je prefere faire|déplace|deplace|décale|decale|mets|bouge/ig,''),S.tasks.filter(x=>!x.done));if(t){t.date=d;t.fixed=true;const m=detectMoment(v);if(m)t.pm=m;place(t);save();weekDay=d;if(d<weekStart||d>addD(weekStart,6))weekStart=monday(d);toast(`« ${t.t} » est maintenant ${rel(d)}.`);return}}
  if(/moins travailler|plus leger|plus legere|lever le pied|plus calme|me reposer/.test(n)){R().fill=.35;const days=[...Array(7)].map((_,i)=>addD(today(),i));let mv=0;days.forEach(x=>{while(overloaded(x)&&mv<20){const m=lighten(x,1);if(!m.length)break;mv++}});save();toast(`C'est noté. Semaine plus légère${mv?`, j'ai déplacé ${mv} chose${mv>1?'s':''}`:''}.`);return}
  if(/nouvelle priorite|priorite/.test(n)){const it=parseLocal(v.replace(/j.?ai une nouvelle priorité\s*:?|nouvelle priorité\s*:?|priorité\s*:?/ig,''))[0];if(it){it.date=it.date||today();const m=commit([{...it,type:PLANNABLE.includes(it.type)?it.type:'tache'}]);m.forEach(x=>x.prio=3);const moved=overloaded(it.date)?lighten(it.date,1):[];save();toast(`Priorité ajoutée ${rel(it.date)}${moved.length?`, j'ai décalé « ${moved[0].t} »`:''}.`);return}}
  const items=await parseText(v.replace(/^ajoute\s*/i,''));
  if(items.length){const m=commit(items);toast(m.length?`Ajouté : ${m.map(x=>x.t).slice(0,2).join(', ')}.`:'C\'est noté.')}
}
async function feedback(v){
  S.journal.push({id:uid(),date:today(),text:v});
  if(S.apiKey){
    try{
      const pool=S.tasks.filter(t=>t.date===today()).map(t=>({id:t.id,t:t.t,done:t.done}));
      const r=jsonOf(await askAI('Tu analyses le récit du soir. Réponds UNIQUEMENT en JSON : {"done":[ids faits],"notdone":[ids non faits],"light":true si elle veut un lendemain plus léger,"nouveaux":[{"t":"titre","type":"tache|projet|experience|apprentissage|habitude|evenement","date":"YYYY-MM-DD ou null"}],"message":"une phrase douce, tutoiement"}. Demain = '+addD(today(),1),`Tâches du jour : ${JSON.stringify(pool)}\nRécit : ${v}`,800));
      (r.done||[]).forEach(id=>{const t=T(id);if(t)t.done=true});
      (r.notdone||[]).forEach(id=>{const t=T(id);if(t&&!t.done){t.date=null;t.postponed++;place(t,addD(today(),1))}});
      if(r.light){S.light[addD(today(),1)]=true;while(overloaded(addD(today(),1))){if(!lighten(addD(today(),1),1).length)break}}
      if(r.nouveaux?.length)commit(r.nouveaux);
      save();toast(r.message||'Merci. J\'ai adapté demain.');return;
    }catch(e){}
  }
  const frags=v.split(/[,.;!]|\bmais\b|\bet\b/i).map(x=>x.trim()).filter(Boolean);
  const pool=S.tasks.filter(t=>t.date===today());let d=0,p=0;
  frags.forEach(f=>{const n=norm(f);
    if(/pas (eu le temps|fait|reussi|pu)|n.?ai pas|oublie|rate/.test(n)){const t=matchTask(f,pool.filter(x=>!x.done));if(t){t.date=null;t.postponed++;place(t,addD(today(),1));p++}}
    else if(/j.?ai|fait|avance|fini|termine|reussi/.test(n)){const t=matchTask(f,pool.filter(x=>!x.done));if(t){t.done=true;d++}
      if(/sport|salle|courir|yoga/.test(n)){S.hlog[today()]=S.hlog[today()]||{};S.hlog[today()].sport=true}}});
  const tm=addD(today(),1);let msg='Merci de m\'avoir raconté.';
  if(/plus leger|plus legere|leger|repos|fatigue|calme|doucement/.test(norm(v))){S.light[tm]=true;let k=0;while(overloaded(tm)&&k<10){if(!lighten(tm,1).length)break;k++}msg='Demain sera plus léger. Je m\'en occupe.'}
  save();toast(`${d?d+' fait'+(d>1?'s':'')+'. ':''}${p?p+' reporté'+(p>1?'s':'')+'. ':''}${msg}`);
}
async function understand(text){
  if(S.apiKey){try{return await askAI("Tu es une présence douce et lucide. En 4 à 6 phrases, en tutoiement, reformule ce que la personne semble vivre, ce qui ressort, et une piste apaisante. Pas de diagnostic, pas de liste, pas de leçon de morale.",text,600)}catch(e){}}
  const n=norm(text);const th=[];
  if(/fatigu|epuis|dormi|sommeil/.test(n))th.push('de la fatigue');
  if(/stress|angoiss|anxi|peur|inquiet/.test(n))th.push('de l\'inquiétude');
  if(/travail|boulot|ratp|alternance|mission/.test(n))th.push('ton travail');
  if(/shaiah|marque|projet|business|client/.test(n))th.push('tes projets');
  if(/argent|budget|payer|depense/.test(n))th.push('l\'argent');
  if(/soeur|famille|mere|pere|ami|copine/.test(n))th.push('tes proches');
  if(/seule|triste|pleur|vide/.test(n))th.push('un besoin de douceur');
  return th.length?`Ce que j'entends surtout : ${th.join(', ')}. C'est beaucoup à porter en même temps, et c'est normal que ça prenne de la place. Tu n'as pas besoin de tout régler ce soir. Choisis une seule chose qui t'allégerait, ou laisse simplement partir le reste.`:"Tu as déposé ce que tu avais sur le cœur, et c'est déjà beaucoup. Rien ici n'a besoin d'être réglé tout de suite. Tu peux garder ces mots, en faire une petite action, ou les laisser partir.";
}

/* ============ VOIX ============ */
let rec=null;
function voice(el){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const ta=$('#'+el.dataset.target);
  if(!SR){ta?.focus();return toast('Utilise le micro de ton clavier pour dicter 🎙')}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='fr-FR';rec.continuous=true;rec.interimResults=true;
  const base=ta.value?ta.value+' ':'';
  document.querySelectorAll('.mic').forEach(m=>m.classList.add('rec'));$('#recbig')?.classList.add('rec');
  rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript;ta.value=base+s};
  rec.onend=()=>{rec=null;document.querySelectorAll('.mic').forEach(m=>m.classList.remove('rec'));$('#recbig')?.classList.remove('rec')};
  rec.onerror=()=>toast('Micro indisponible. Utilise la dictée du clavier.');
  rec.start();toast('Je t\'écoute…');
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&e.target!==el)return;
  const f=A[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('input',e=>{
  const x=e.target;
  if(x.dataset.draft!=null){const d=draft[+x.dataset.draft];d[x.dataset.f]=x.value;if(x.dataset.f==='type'||x.dataset.f==='date')render()}
  if(x.dataset.p&&route==='project'){const p=S.projects.find(y=>y.id===param);p[x.dataset.p]=x.value;save()}
  if(x.dataset.rw!=null){R().week[+x.dataset.rw][x.dataset.f]=x.value;R().set=true;save()}
  if(x.dataset.r){R()[x.dataset.r]=x.dataset.r==='commute'?(+x.value||0):x.value;R().set=true;save()}
  if(x.dataset.goal!=null&&onb){onb.goals[+x.dataset.goal].t=x.value}
  if(x.dataset.s){S[x.dataset.s]=x.dataset.s==='cap'?(+x.value||200):x.value;save()}
});
document.addEventListener('change',e=>{if(e.target.dataset.a==='pmain')A.pmain(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){const id=e.target.id;const map={cmd:'cmd',quickAdd:'quickAdd',newAct:'addAct',newHabit:'addHabit',qT:'qTaskGo',qI:'qIdeaGo',onbAdd:'onbAddGoal'};if(map[id]){e.preventDefault();A[map[id]]({dataset:{}},e)}}});
let lastMoment=moment();setInterval(()=>{if(route==='home'&&!moodOverride&&moment()!==lastMoment){lastMoment=moment();render()}},60000);
